<!doctype html>
<!-- Single shell: chrome + embedded sidebar (no separate chrome.html / sidebar.html). -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Sparo</title>
    <style>
:root {
  color-scheme: light;
  --page: #e4e0dc;
  --bg: #eeeae6;
  --bg2: #eeeae6;
  --side: #f3f0ec;
  --card: transparent;
  --line: #ddd8d2;
  --text: #1c1a18;
  --muted: #6e6a66;
  --accent: #2c2a28;
  --accent-ink: #f7f4f0;
  --tab: #e8e4e0;
  --tab-active: #fbfaf8;
  --ok: #5a8f62;
  --warn: #8a7a4a;
  --bad: #a45a52;
  --paper: #fbfaf8;
  --composer: #fbfaf8;
  --chrome-h: 104px;
  --side-w: 312px;
  --radius-btn: 999px;
  --radius-in: 16px;
  font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  user-select: none;
}
input, textarea, select, .chat-log, .chat-log .bubble {
  user-select: text;
  -webkit-user-select: text;
}
.app {
  display: grid;
  grid-template-columns: 1fr var(--side-w);
  grid-template-rows: env(titlebar-area-height, 36px) 40px 28px 1fr;
  height: 100%;
  width: 100%;
}
.page-hole {
  grid-column: 1;
  grid-row: 4;
  background: var(--paper);
  position: relative;
  min-width: 0;
}
.sidebar {
  grid-column: 2;
  grid-row: 2 / -1;
  background: var(--side);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  z-index: 5;
  position: relative;
  color: var(--text);
}
.tabs-row {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: stretch;
  gap: 0;
  height: env(titlebar-area-height, 36px);
  width: env(titlebar-area-width, 100%);
  margin-left: env(titlebar-area-x, 0px);
  background: var(--bg);
  min-width: 0;
  -webkit-app-region: drag;
  position: relative;
  z-index: 3;
}
.tabs {
  display: flex;
  align-items: stretch;
  gap: 2px;
  padding: 4px 6px 0;
  height: 100%;
  background: transparent;
  overflow-x: auto;
  flex: 0 1 auto;
  max-width: calc(100% - 72px);
  min-width: 0;
  -webkit-app-region: no-drag;
}
.title-drag {
  flex: 1 1 64px;
  min-width: 48px;
  height: 100%;
  -webkit-app-region: drag;
  cursor: default;
}
.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 180px;
  min-width: 80px;
  padding: 0 8px 0 10px;
  background: var(--tab);
  border-radius: 8px 8px 0 0;
  font-size: 12px;
  border: 1px solid transparent;
  border-bottom: 0;
  -webkit-app-region: no-drag;
}
.tab.active {
  background: var(--tab-active);
  border-color: var(--line);
}
.tab.drag-over {
  box-shadow: inset 2px 0 0 var(--accent);
}
.tab.sleeping {
  opacity: 0.62;
}
.tab.sleeping .title::before {
  content: "☾ ";
  color: #8a7a62;
}
.tab .title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tab .x, .new-tab, .nav button, .go, .icon-btn, .sidebar button, .bm-chip, .menu-item {
  border: 0;
  cursor: default;
}
.tab .x {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  line-height: 1;
  padding: 0;
}
.tab .x:hover { background: rgba(44,42,40,.08); color: var(--text); }
.new-tab {
  width: 28px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  -webkit-app-region: no-drag;
}
.new-tab:hover { color: var(--text); }
.bar {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 40px;
  padding: 0 8px;
  background: var(--bg2);
  border-right: 1px solid var(--line);
  z-index: 2;
  position: relative;
}
.nav { display: flex; gap: 2px; }
.nav button, .icon-btn {
  width: 32px;
  height: 28px;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 14px;
}
.nav button:disabled { opacity: 0.35; }
.nav button:hover:not(:disabled),
.icon-btn:hover { background: rgba(44,42,40,.08); }
.icon-btn.on { color: #b0892c; }
.mem-chip {
  flex: 0 0 auto;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--text);
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.mem-chip:hover { background: #fff; }
.url {
  flex: 1;
  height: 28px;
  border-radius: var(--radius-btn);
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--text);
  padding: 0 12px;
  font-size: 13px;
  outline: none;
}
.url:focus { border-color: var(--text); }
.go {
  height: 28px;
  padding: 0 14px;
  border-radius: var(--radius-btn);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 12px;
  font-weight: 620;
}
.reply-one {
  height: 28px;
  padding: 0 12px;
  border-radius: var(--radius-btn);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 12px;
  border: 0;
  cursor: default;
  white-space: nowrap;
}
.reply-one:disabled { opacity: 0.5; }
.bm-bar {
  grid-column: 1;
  grid-row: 3;
  display: flex;
  align-items: center;
  gap: 2px;
  height: 28px;
  padding: 0 8px;
  background: var(--bg);
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  overflow: hidden;
  width: 100%;
  min-width: 0;
}
.bm-chip {
  max-width: 160px;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 0 0 auto;
}
.bm-chip:hover { background: rgba(44,42,40,.06); }
.bm-more {
  flex: 0 0 auto;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  background: #e8e4e0;
  color: var(--text);
  font-size: 11px;
  border: 0;
}
.bm-more:hover { background: #ddd8d2; }
.bm-empty {
  color: var(--muted);
  font-size: 11px;
  padding-left: 4px;
}
.bm-menu-wrap { position: relative; }
.bm-menu {
  display: none;
  position: absolute;
  right: 0;
  top: 32px;
  width: 280px;
  max-height: 360px;
  overflow: auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(40,32,24,.14);
  padding: 6px;
  z-index: 20;
}
.bm-menu.open { display: block; }
.menu-item {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--text);
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 8px;
}
.menu-item:hover { background: rgba(44,42,40,.06); }
.menu-item:disabled { opacity: 0.4; }
.menu-sep {
  height: 1px;
  background: var(--line);
  margin: 4px 0;
}
.menu-hint {
  font-size: 10px;
  color: var(--muted);
  padding: 4px 10px 6px;
}
.toast {
  display: none;
  position: absolute;
  left: 50%;
  top: 100%;
  margin-top: 8px;
  transform: translateX(-50%);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  white-space: nowrap;
  z-index: 30;
  -webkit-app-region: no-drag;
}
.toast.show { display: block; }
.toast.has-path { cursor: pointer; }

.find-bar {
  display: none;
  position: absolute;
  right: 8px;
  top: 4px;
  height: 32px;
  align-items: center;
  gap: 4px;
  background: var(--tab-active);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 4px 0 10px;
  z-index: 8;
  box-shadow: 0 6px 18px rgba(28,26,24,.12);
}
.find-bar.open { display: flex; }
.find-bar input {
  width: 168px;
  border: 0;
  background: transparent;
  font-size: 13px;
  outline: none;
  color: var(--text);
}
.find-count {
  font-size: 11px;
  color: var(--muted);
  min-width: 40px;
  text-align: right;
}
.history-panel {
  display: none;
  position: absolute;
  inset: 0;
  background: var(--paper);
  flex-direction: column;
  z-index: 4;
  user-select: text;
  -webkit-user-select: text;
}
.history-panel.open { display: flex; }
.history-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
.history-head h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  flex: 0 0 auto;
}
.history-head input {
  flex: 1;
  min-width: 0;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
}
.history-list {
  flex: 1;
  overflow: auto;
  padding: 8px 0 16px;
}
.history-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 16px;
  cursor: default;
  border: 0;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--text);
  font: inherit;
}
.history-item:hover { background: rgba(44,42,40,.06); }
.history-item .ht { font-size: 13px; }
.history-item .hu { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-empty { padding: 24px 16px; color: var(--muted); font-size: 13px; }
.history-head button.ghost {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  padding: 0 8px;
  height: 32px;
  cursor: default;
  flex: 0 0 auto;
}
.history-head button.ghost:hover { color: var(--text); }

.side-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 18px 20px 8px;
}
.side-acts {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex: 0 0 auto;
}
.mark {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.01em;
  text-transform: uppercase;
}
.gear, .done {
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  padding: 0;
}
.gear:hover, .done:hover { color: var(--text); }

.thread {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 8px 20px 12px;
}
.chat-log {
  min-height: 0;
  font-size: 14px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: transparent;
  border-radius: 0;
  padding: 0;
  margin: 0;
}
.chat-log .bubble-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  max-width: 100%;
}
.chat-log .bubble-row.me { flex-direction: row-reverse; }
.chat-log .avatar {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e8e4e0;
  color: var(--muted);
}
.chat-log .bubble-row.sparo .avatar,
.chat-log .bubble-row.me .avatar {
  background: #e8e4e0;
  color: var(--muted);
}
.chat-log .bubble {
  max-width: 80%;
  padding: 0;
  border-radius: 0;
  white-space: pre-wrap;
  word-break: break-word;
  background: transparent;
  color: var(--text);
}
.chat-log .bubble.me { color: var(--muted); }
.chat-log .bubble.sparo { color: var(--text); }
.chat-log .bubble-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 80%;
  min-width: 0;
}
.chat-log .bubble-row.me .bubble-wrap { align-items: flex-end; }
.chat-log .bubble-wrap .bubble { max-width: 100%; }
.chat-log .bubble-copy {
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  padding: 0;
  line-height: 1;
}
.chat-log .bubble-copy:hover { color: var(--text); }
.doc-card {
  margin-top: 6px;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  color: var(--text);
}
.doc-card:hover { border-color: #c8c0b6; }
.doc-card .kicker {
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--muted);
  margin-bottom: 4px;
}
.doc-card .ttl { font-size: 13px; line-height: 1.35; }
.doc-card .go { font-size: 11px; color: var(--muted); margin-top: 6px; }
.thread-tools {
  display: flex;
  justify-content: flex-end;
  gap: 14px;
  padding: 0 20px 6px;
  flex: 0 0 auto;
}
.thread-tools button {
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  padding: 0;
}
.thread-tools button:hover { color: var(--text); }

.pause-bar {
  margin: 0 16px 10px;
  padding: 8px 4px 0;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
}
.pause-bar.hide { display: none; }
.pause-bar button { color: var(--text); font-size: 12px; background: transparent; padding: 0; }

.ask-card {
  margin: 0 16px 8px;
  padding: 12px 4px 0;
  border-top: 1px solid var(--line);
}
.ask-card.hide { display: none; }
.approval {
  padding: 8px 0;
}
.approval .row button {
  padding: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
}
.approval .row button.ok { color: var(--text); font-weight: 560; }

.dock { padding: 0 16px 16px; }
.shortcuts {
  display: flex;
  gap: 14px;
  padding: 0 4px 10px;
  color: var(--muted);
  font-size: 12px;
}
.shortcuts .job {
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  padding: 0;
}
.shortcuts .job:hover { color: var(--text); }
.shortcuts .job:disabled { opacity: 0.4; }

.composer {
  background: var(--composer);
  border-radius: var(--radius-in);
  padding: 12px 12px 10px;
  border: 1px solid var(--line);
}
.composer textarea,
.chat-input textarea {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
  font: 14px/1.45 inherit;
  resize: none;
  min-height: 52px;
  max-height: 140px;
  outline: none;
  padding: 0;
  border-radius: 0;
}
.composer textarea::placeholder { color: var(--muted); }
.go-row { display: flex; justify-content: flex-end; }
#chatSend {
  background: var(--accent);
  color: var(--accent-ink);
  height: 30px;
  padding: 0 14px;
  border-radius: var(--radius-btn);
  font-size: 12px;
  font-weight: 620;
}
.note, #chatHint {
  margin-top: 8px;
  font-size: 11px;
  color: var(--muted);
  padding: 0 6px;
  line-height: 1.45;
}
.quick-status {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  padding: 0 6px;
}

.drawer {
  display: none;
  position: absolute;
  inset: 0;
  background: var(--side);
  flex-direction: column;
  padding: 18px 20px 16px;
  overflow: auto;
  z-index: 6;
}
.drawer.open { display: flex; }
.drawer-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 22px;
}
.drawer h2 {
  font-size: 15px;
  font-weight: 560;
  margin: 0;
}
.block { margin-bottom: 22px; }
.block h3, .label {
  font-size: 13px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text);
  font-weight: 560;
  margin: 0 0 10px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0 0 12px;
}
.field label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.block input, .block select,
.field input, .field select,
.lang-row select {
  width: 100%;
  height: 36px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  outline: none;
  margin: 0;
  padding: 0 2px;
}
.lang-row { margin: 0; }
.ds-status { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.ds-status.ok { color: var(--text); }
.mode-cards { display: flex; gap: 8px; margin: 0 0 12px; }
.mode-card {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 10px 12px;
  cursor: pointer;
  background: transparent;
  text-align: left;
  color: inherit;
  font: inherit;
}
.mode-card.on {
  background: #e8e4e0;
  border-color: var(--text);
}
.mode-card strong { display: block; font-size: 13px; margin-bottom: 4px; }
.mode-card span { display: block; font-size: 11px; color: var(--muted); line-height: 1.4; }
#cloudQuota { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.switch {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  margin: 8px 0 10px;
}
.switch input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.switch .track {
  flex: 0 0 36px;
  width: 36px;
  height: 22px;
  border-radius: 999px;
  background: #ddd8d2;
  position: relative;
}
.switch .track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fbfaf8;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { left: 16px; }
.switch span { font-size: 13px; color: var(--text); line-height: 1.35; }
.idle-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 4px;
}
.idle-row input {
  width: 52px;
  height: 32px;
  text-align: center;
  flex: 0 0 52px;
  border-bottom: 1px solid var(--line);
}
.fold {
  border-top: 1px solid var(--line);
  padding: 12px 0 4px;
  margin: 0 0 8px;
}
.fold > summary {
  list-style: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 560;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after {
  content: "›";
  color: var(--muted);
  font-size: 16px;
  transform: rotate(90deg);
}
.fold[open] > summary::after { transform: rotate(-90deg); }
.fold .fold-body { padding-top: 12px; }
.linkish {
  display: inline-block;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  padding: 0;
  margin: 0 0 10px;
}
.linkish:hover { color: var(--text); }
.cap, .hint {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
  margin: 0;
}
.value { font-size: 12px; word-break: break-all; }
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  background: var(--ok);
}
.dot.paused { background: var(--warn); }
.dot.rec { background: var(--bad); }

.sidebar .primary,
.sidebar button.ok,
.sidebar #btnDsSave,
.sidebar #btnPfSave,
.sidebar #btnCopyAgent,
.sidebar .save {
  background: var(--accent);
  color: var(--accent-ink);
  height: 36px;
  padding: 0 14px;
  border-radius: var(--radius-btn);
  font-size: 13px;
  font-weight: 620;
  width: 100%;
  margin-top: 4px;
}
.row button.save,
.approval .row button.ok {
  width: auto;
  height: 32px;
}
.sidebar button.ghost {
  background: transparent;
  color: var(--muted);
  padding: 8px 0;
  font-size: 12px;
}
.sidebar button.danger {
  background: transparent;
  color: var(--bad);
  padding: 8px 0;
  font-size: 12px;
}
.sidebar button:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; gap: 12px; }
.row button { flex: 1; }
.drawer .ghost,
.block .ghost {
  display: block;
  width: 100%;
  margin-top: 10px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.cs-draft {
  margin-top: 6px;
  max-height: 90px;
  overflow: auto;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text);
  white-space: pre-wrap;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 8px;
}
.cs-badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 999px;
  background: #e8e4e0;
  color: var(--text);
  margin-right: 4px;
}
.qa-item { font-size: 11px; margin: 2px 0; }
.qa-item.pass { color: var(--ok); }
.qa-item.fail { color: var(--bad); }
.qa-item.warn { color: var(--warn); }
.hide { display: none !important; }

.modal-mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(40,32,24,.35);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-mask.show { display: flex; }
.modal-box {
  width: min(320px, 90vw);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 18px 44px rgba(40,32,24,.16);
}
.modal-box p { margin: 0 0 12px; font-size: 13px; line-height: 1.45; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button {
  min-width: 72px;
  height: 32px;
  border-radius: var(--radius-btn);
  padding: 0 12px;
}
.modal-actions #confirmOk {
  background: var(--accent);
  color: var(--accent-ink);
}
.modal-actions #confirmCancel {
  background: transparent;
  color: var(--muted);
}

.product-tag { display: none; }
.chat-card, .card { background: transparent; border: 0; padding: 0; }
.chat-input { display: contents; }
.chat-actions { display: none; }
.act-grid { display: none; }
.more-toggle { display: none; }
.more-body { }
.scroll { }
#approvalsCard { flex: 0 0 auto; }

    <script type="module">
      import { t, setLocale, applyDom, getLocale, LOCALE_META } from "./i18n.ts";
      const tabsEl = document.getElementById("tabs");
      const urlEl = document.getElementById("url");
      const backEl = document.getElementById("back");
      const forwardEl = document.getElementById("forward");
      const reloadEl = document.getElementById("reload");
      const goEl = document.getElementById("go");
      const starEl = document.getElementById("btnStar");
      const bmBarEl = document.getElementById("bmBar");
      const bmEmptyEl = document.getElementById("bmEmpty");
      const toastEl = document.getElementById("toast");

      let chromeState = {
        tabs: [],
        activeId: null,
        url: "",
        canGoBack: false,
        canGoForward: false,
        isLoading: false,
        barAll: [],
        barTotal: 0,
        total: 0,
        currentBookmarked: false,
        canImportChrome: false,
        canImportEdge: false,
      };
      let paused = false;
      let toastTimer = null;
      let overflowUrls = [];
      let userProfile = { nickname: "" };

      let lastSidebar = null;
      let moreOpen = false;
      let GATEWAYS = [];

      function fillGatewaySelect(list) {
        const sel = document.getElementById("dsGateway");
        if (!sel) return;
        if (Array.isArray(list) && list.length) GATEWAYS = list;
        if (sel.options.length > 1) return;
        sel.innerHTML = "";
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = t("ds.gateway.pick");
        sel.appendChild(blank);
        for (const g of GATEWAYS) {
          const o = document.createElement("option");
          o.value = g.id;
          o.textContent = g.label;
          sel.appendChild(o);
        }
      }
      function toggleGatewayRow(provider) {
        const row = document.getElementById("dsGatewayRow");
        if (row) row.style.display = provider === "custom" ? "" : "none";
      }

      function fillLocaleSelect() {
        const sel = document.getElementById("localeSelect");
        if (!sel) return;
        if (!sel.options.length) {
          for (const m of LOCALE_META) {
            const o = document.createElement("option");
            o.value = m.id;
            o.textContent = m.native;
            sel.appendChild(o);
          }
        }
        sel.value = getLocale();
      }

      function applyLanguage(locale) {
        setLocale(locale);
        if (lastSidebar) lastSidebar.locale = locale;
        applyDom();
        fillLocaleSelect();
        if (lastSidebar) applySidebar(lastSidebar);
        renderChrome();
        const hp = document.getElementById("historyPanel");
        if (hp && hp.classList.contains("open")) {
          try { renderHistory(); } catch { /* not ready */ }
        }
      }

      function toast(text, path) {
        toastEl.textContent = text;
        toastEl.classList.add("show");
        toastEl.classList.toggle("has-path", Boolean(path));
        toastEl.dataset.path = path || "";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
      }
      window.__sparkToast = toast;
      toastEl.addEventListener("click", () => {
        const p = toastEl.dataset.path;
        if (p) window.sparkShell.showInFolder(p);
      });

      function openBmMenu() {
        window.sparkShell.openBookmarksMenu({ overflowUrls });
      }

      function packBookmarkBar() {
        bmBarEl.querySelectorAll(".bm-chip, .bm-more").forEach((n) => n.remove());
        const all = chromeState.barAll || [];
        overflowUrls = [];
        if (!all.length) {
          bmEmptyEl.style.display = "";
          return;
        }
        bmEmptyEl.style.display = "none";

        const avail = Math.max(80, bmBarEl.clientWidth - 4);
        const moreW = 68;
        const gap = 2;
        const widths = all.map((b) => {
          const probe = document.createElement("button");
          probe.className = "bm-chip";
          probe.textContent = b.title || b.url;
          probe.style.cssText = "position:absolute;visibility:hidden;left:-9999px";
          bmBarEl.appendChild(probe);
          const w = probe.offsetWidth;
          probe.remove();
          return w;
        });

        const fitted = [];
        let used = 0;
        for (let i = 0; i < all.length; i++) {
          const w = widths[i];
          const hasMoreAfter = i < all.length - 1;
          const reserve = hasMoreAfter ? moreW : 0;
          const next = used + (fitted.length ? gap : 0) + w;
          if (fitted.length > 0 && next + reserve > avail) {
            overflowUrls = all.slice(i).map((x) => x.url);
            break;
          }
          fitted.push(all[i]);
          used = next;
        }
        if (!overflowUrls.length && fitted.length < all.length) {
          overflowUrls = all.slice(fitted.length).map((x) => x.url);
        }

        for (const b of fitted) {
          const chip = document.createElement("button");
          chip.className = "bm-chip";
          chip.textContent = b.title || b.url;
          chip.title = b.url;
          chip.onclick = () => window.sparkShell.openBookmark(b.url);
          bmBarEl.appendChild(chip);
        }
        if (overflowUrls.length) {
          const more = document.createElement("button");
          more.className = "bm-more";
          more.textContent = "» " + overflowUrls.length;
          more.title = t("bookmark.moreTitle", { n: overflowUrls.length });
          more.onclick = (e) => {
            e.stopPropagation();
            openBmMenu();
          };
          bmBarEl.appendChild(more);
        }
      }

      let draggingTabId = "";
      function renderChrome() {
        tabsEl.innerHTML = "";
        for (const tab of chromeState.tabs) {
          const el = document.createElement("div");
          el.className =
            "tab" +
            (tab.id === chromeState.activeId ? " active" : "") +
            (tab.discarded ? " sleeping" : "");
          el.draggable = true;
          el.dataset.id = tab.id;
          el.title = (tab.discarded ? t("mem.tabSleeping") + "\n" : "") + (tab.url || "");
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = tab.title || tab.url || t("tab.new");
          const x = document.createElement("button");
          x.className = "x";
          x.textContent = "×";
          x.draggable = false;
          x.onclick = (e) => {
            e.stopPropagation();
            window.sparkShell.closeTab(tab.id);
          };
          el.onclick = () => window.sparkShell.switchTab(tab.id);
          el.addEventListener("auxclick", (e) => {
            if (e.button !== 1) return;
            e.preventDefault();
            e.stopPropagation();
            window.sparkShell.closeTab(tab.id);
          });
          el.addEventListener("dragstart", (e) => {
            draggingTabId = tab.id;
            e.dataTransfer.setData("text/plain", tab.id);
            e.dataTransfer.effectAllowed = "move";
          });
          el.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            el.classList.add("drag-over");
          });
          el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
          el.addEventListener("drop", (e) => {
            e.preventDefault();
            el.classList.remove("drag-over");
            const from = e.dataTransfer.getData("text/plain") || draggingTabId;
            if (from && from !== tab.id) window.sparkShell.reorderTabs(from, tab.id);
          });
          el.appendChild(title);
          el.appendChild(x);
          tabsEl.appendChild(el);
        }
        const add = document.createElement("button");
        add.className = "new-tab";
        add.textContent = "+";

        packBookmarkBar();

      function formatWhen(ts) {
        try {
          const d = new Date(ts);
          if (Number.isNaN(d.getTime())) return "";
          return d.toLocaleString();
        } catch {
          return "";
        }
      }
      function renderHistory() {
        const q = (historyFilter.value || "").trim().toLowerCase();
        const rows = historyItems
          .slice()
          .reverse()
          .filter((h) => {
            if (!q) return true;
            return String(h.title || "").toLowerCase().includes(q) || String(h.url || "").toLowerCase().includes(q);
          });
        historyList.innerHTML = "";
        if (!rows.length) {
          const empty = document.createElement("div");
          empty.className = "history-empty";
          empty.textContent = t("history.empty");
          historyList.appendChild(empty);
          return;
        }
        for (const h of rows) {
          const btn = document.createElement("button");
          btn.className = "history-item";
          btn.type = "button";
          const ht = document.createElement("span");
          ht.className = "ht";
          ht.textContent = h.title || h.url;
          const hu = document.createElement("span");
          hu.className = "hu";
          hu.textContent = (formatWhen(h.ts) ? formatWhen(h.ts) + " · " : "") + (h.url || "");
          btn.appendChild(ht);
          btn.appendChild(hu);
          btn.onclick = () => {
            window.sparkShell.navigate(h.url);
            window.sparkShell.closeHistory();
          };
          historyList.appendChild(btn);
        }
      }
      function showHistory(items) {
        if (!items) {
          historyPanel.classList.remove("open");

      function askConfirm(message) {
        return new Promise((resolve) => {
          const mask = document.getElementById("confirmMask");
          const text = document.getElementById("confirmText");
          const ok = document.getElementById("confirmOk");
          const cancel = document.getElementById("confirmCancel");
          text.textContent = message;
          mask.classList.add("show");
          const done = (value) => {
            mask.classList.remove("show");
            ok.onclick = null;
            cancel.onclick = null;
            mask.onclick = null;
            resolve(value);
          };
          ok.onclick = () => done(true);
          cancel.onclick = () => done(false);
          mask.onclick = (e) => {
            if (e.target === mask) done(false);
          };
        });
      }

      function bindShell() {
        if (!window.sparkShell) {
          console.error("[shell] sparkShell missing");
          document.getElementById("status").textContent = t("shell.missing");
          return;
        }
        const hole = document.getElementById("pageHole");
        const reportHole = () => {
          if (!hole || !window.sparkShell.pageHoleBounds) return;
          const r = hole.getBoundingClientRect();
          window.sparkShell.pageHoleBounds({
            x: r.left,
            y: r.top,
            width: r.width,
            height: r.height,
          });
        };
        reportHole();
        if (typeof ResizeObserver === "function") {
          new ResizeObserver(reportHole).observe(hole);
        }
        window.addEventListener("resize", reportHole);
        window.sparkShell.onChromeState((s) => {
          chromeState = { ...chromeState, ...(s || {}) };
          renderChrome();
        });
        window.sparkShell.onSidebarState(applySidebar);
        window.sparkShell.onToast?.((payload) => {
          if (payload && payload.text) toast(payload.text, payload.path);
        });
        window.sparkShell.onOpenFind?.(openFindBar);
        window.sparkShell.onCloseFind?.(() => {
          findBar.classList.remove("open");
          findCount.textContent = "";
        });
        window.sparkShell.onFindResult?.((result) => {
          const total = Number(result.total || 0);
          const active = Number(result.active || 0);
          findCount.textContent = total ? active + " / " + total : "";
        });
        window.sparkShell.onFindAgain?.((opts) => {
          if (!findBar.classList.contains("open")) openFindBar();
          runFind({ findNext: true, forward: opts.forward !== false });
        });
        window.sparkShell.onHistory?.((payload) => showHistory(payload.items));
        window.sparkShell.listTabs().then((s) => {
          if (s) {
            chromeState = { ...chromeState, ...s };
            renderChrome();
          }
        });
        window.sparkShell.listBookmarks().then((s) => {
          if (s) {
            chromeState = { ...chromeState, ...s };
            renderChrome();
          }
        });
        window.sparkShell.getStatus().then(applySidebar);

          buttons.forEach((b) => { b.disabled = true; });
          const old = btn ? btn.textContent : "";
          if (btn) btn.textContent = t("act.replyBusy");

            const r = await window.sparkShell.csOneClick();
            toast((r && r.message) || t("toast.handled"));

            toast(t("toast.replyFail"));

            buttons.forEach((b) => { b.disabled = false; });

        async function runChatGoal(text, btn) {
          if (!text) return;

          if (btn) {

            btn.textContent = "…";

          try {
            await window.sparkShell.chat(text);

            console.error(err);
            toast(t("toast.fail"));
          } finally {
            if (btn) {
              btn.disabled = false;
              btn.textContent = old;
            }
          }
        }
        document.getElementById("btnSummarize").onclick = () =>
          runChatGoal(t("goal.summarize"), document.getElementById("btnSummarize"));
        document.getElementById("btnFillForm").onclick = () =>
          runChatGoal(t("goal.fill"), document.getElementById("btnFillForm"));
        document.getElementById("btnPublish").onclick = () =>
          runChatGoal(t("goal.publish"), document.getElementById("btnPublish"));
        async function sendChat() {
          const input = document.getElementById("chatInput");
          const text = input.value.trim();
          if (!text) return;
          input.value = "";
          const sendBtn = document.getElementById("chatSend");
          sendBtn.disabled = true;
          sendBtn.textContent = "…";
          try {
            await window.sparkShell.chat(text);
          } catch (err) {
            console.error(err);
          } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = t("chat.send");
            input.focus();
            scrollChatToEnd();
          }
        }
        document.getElementById("chatSend").onclick = sendChat;
        document.getElementById("chatInput").addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendChat();
          }
        });
        const PRESETS = {
          deepseek: {
            baseUrl: "https://api.deepseek.com",
            model: "deepseek-v4-flash",
            hint: "Recommended. Key from platform.deepseek.com",
          },
          openai: {
            baseUrl: "https://api.openai.com/v1",
            model: "gpt-4.1-mini",
            hint: "Key from platform.openai.com — uses OpenAI API host",
          },
          custom: {
            baseUrl: "https://api.openai.com/v1",
            model: "gpt-4.1-mini",
            hint: "Any OpenAI-compatible gateway — set Base URL + Model yourself",
          },
        };
        function applyProviderPreset(localOnly) {
          const provider = document.getElementById("dsProvider").value || "deepseek";
          const p = PRESETS[provider] || PRESETS.deepseek;
          document.getElementById("dsModel").value = p.model;
          document.getElementById("dsBase").value = p.baseUrl;
          document.getElementById("dsHint").textContent = t("ds.hint." + provider) || t("ds.hint.deepseek");
          toggleGatewayRow(provider);
          const gw = document.getElementById("dsGateway");
          if (gw && provider !== "custom") gw.value = "";
          if (!localOnly) {
            /* wait for Save to persist */
          }
        }
        document.getElementById("dsProvider").onchange = () => applyProviderPreset(true);
        const gwSel = document.getElementById("dsGateway");
        if (gwSel) {
          gwSel.onchange = () => {
            const g = GATEWAYS.find((x) => x.id === gwSel.value);
            if (!g) return;
            document.getElementById("dsBase").value = g.baseUrl;
            document.getElementById("dsModel").value = g.model;
          };
        }

        document.getElementById("btnDsSave").onclick = async () => {
          const provider = document.getElementById("dsProvider").value || "deepseek";
          const model = document.getElementById("dsModel").value.trim();
          const baseUrl = document.getElementById("dsBase").value.trim();
          const key = document.getElementById("dsKey").value.trim();
          try {
            const r = await window.sparkShell.saveSettings({
              provider,
              model,
              baseUrl,
              apiKey: key || undefined,
              llmMode: "byok",
              applyPreset: false,
            });
            if (key) document.getElementById("dsKey").value = "";
            byokEditOpen = false;
            toast(r && r.message ? r.message : t("toast.saved"));
          } catch (err) {
            console.error(err);
            toast(t("toast.saveFail"));
          }
        };
        async function setLlmMode(llmMode) {
          try {
            const r = await window.sparkShell.saveSettings({ llmMode });
            toast(r && r.message ? r.message : t("toast.saved"));
          } catch (err) {
            console.error(err);
            toast(t("toast.saveFail"));
          }
        }
        const modeByok = document.getElementById("modeByok");
        const modeCloud = document.getElementById("modeCloud");
        if (modeByok) modeByok.onclick = () => setLlmMode("byok");
        if (modeCloud) modeCloud.onclick = () => setLlmMode("cloud");
        const btnByokEdit = document.getElementById("btnByokEdit");
        if (btnByokEdit) {
          btnByokEdit.onclick = () => {
            byokEditOpen = true;
            const ds = lastSidebar && lastSidebar.deepseek;
            const cloud = (lastSidebar && lastSidebar.cloud) || {};
            syncByokFold(ds, cloud);
          };
        }
        const btnCloudCode = document.getElementById("btnCloudCode");
        if (btnCloudCode) {
          btnCloudCode.onclick = async () => {
            const email = document.getElementById("cloudEmail").value.trim();
            try {
              const r = await window.sparkShell.cloudSendCode(email);
              toast(r && r.message ? r.message : t("cloud.codeSent"));
            } catch (err) {
              console.error(err);
              toast(t("toast.saveFail"));
            }
          };
        }
        const btnCloudVerify = document.getElementById("btnCloudVerify");
        if (btnCloudVerify) {
          btnCloudVerify.onclick = async () => {
            const email = document.getElementById("cloudEmail").value.trim();
            const code = document.getElementById("cloudCode").value.trim();
            try {
              const r = await window.sparkShell.cloudVerify(email, code);
              toast(r && r.message ? r.message : t("toast.cloudIn"));
            } catch (err) {
              console.error(err);
              toast(t("toast.saveFail"));
            }
          };
        }
        const btnCloudLogout = document.getElementById("btnCloudLogout");
        if (btnCloudLogout) {
          btnCloudLogout.onclick = async () => {
            try {
              const r = await window.sparkShell.cloudLogout();
              toast(r && r.message ? r.message : t("toast.cloudOut"));
            } catch (err) {
              console.error(err);
              toast(t("toast.saveFail"));
            }
          };
        }
        const btnCloudAccount = document.getElementById("btnCloudAccount");
        if (btnCloudAccount) {
          btnCloudAccount.onclick = async () => {
            try {
              await window.sparkShell.cloudOpenAccount();
            } catch (err) {
              console.error(err);
              toast(t("toast.fail"));
            }
          };
        }

        async function optimizeMemory() {
          try {
            const r = await window.sparkShell.discardInactiveTabs();
            toast((r && r.message) || t("toast.handled"));
          } catch (err) {
            console.error(err);
            toast(t("mem.fail"));
          }
        }
        const btnMem = document.getElementById("btnMem");
        if (btnMem) btnMem.onclick = optimizeMemory;
        async function saveMemoryPrefs(quiet) {
          const memEl = document.getElementById("memSaver");
          const idleEl = document.getElementById("memIdle");
          if (!memEl || !idleEl) return;
          const on = memEl.checked;
          const mins = Number(idleEl.value) || 2;
          const idleRow = document.getElementById("memIdleRow");
          if (idleRow) idleRow.style.display = on ? "" : "none";
          try {
            const r = await window.sparkShell.saveSettings({
              memorySaver: on,
              memorySaverIdleMinutes: mins,
            });
            if (!quiet) {
              toast(r && r.ok ? (on ? t("mem.autoOn") : t("mem.autoOff")) : t("toast.saveFail"));
            }
          } catch (err) {
            console.error(err);
            if (!quiet) toast(t("toast.saveFail"));
          }
        }
        const memSaver = document.getElementById("memSaver");
        if (memSaver) memSaver.onchange = () => saveMemoryPrefs(false);
        const memIdle = document.getElementById("memIdle");
        if (memIdle) {
          let idleTimer;
          memIdle.addEventListener("change", () => saveMemoryPrefs(true));
          memIdle.addEventListener("input", () => {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => saveMemoryPrefs(true), 600);
          });
        }

        // ---- My profile ----
        function parseAccounts(raw) {
          const out = [];
          for (const part of String(raw || "").split(/[,，]/)) {
            const m = part.trim().match(/^([^:：]+)[:：](.+)$/);
            if (m) out.push({ site: m[1].trim(), username: m[2].trim() });
          }
          return out;
        }
        function accountsText(accs) {
          return (accs || []).map((a) => a.site + ":" + a.username).join(", ");
        }
        async function loadProfileIntoForm() {
          try {
            const r = await window.sparkShell.getProfile();
            if (!r) return;
            const id = r.identity || {};
            document.getElementById("pfNick").value = id.nickname || "";
            document.getElementById("pfAccounts").value = accountsText(id.accounts);
            document.getElementById("pfTopics").value = (id.topics || []).join(", ");
            document.getElementById("pfStyle").value = id.writingStyle || "";
            const notes = document.getElementById("pfNotes");
            const forbid = document.getElementById("pfForbid");
            if (notes) notes.value = id.workNotes || "";
            if (forbid) forbid.value = id.forbidden || "";
          } catch (err) {
            console.error(err);
          }
        }
        document.getElementById("btnPfSave").onclick = async () => {
          try {
            const r = await window.sparkShell.saveIdentity({
              nickname: document.getElementById("pfNick").value.trim(),
              accounts: parseAccounts(document.getElementById("pfAccounts").value),
              topics: document.getElementById("pfTopics").value
                .split(/[,，]/).map((s) => s.trim()).filter(Boolean),
              writingStyle: document.getElementById("pfStyle").value.trim(),
              workNotes: (document.getElementById("pfNotes") || {}).value
                ? document.getElementById("pfNotes").value.trim()
                : "",
              forbidden: (document.getElementById("pfForbid") || {}).value
                ? document.getElementById("pfForbid").value.trim()
                : "",
            });
            toast(t("toast.remembered"));
          } catch (err) {
            console.error(err);
            toast(t("toast.saveFail"));
          }
        };
        document.getElementById("btnPfView").onclick = async () => {
          try {
            const r = await window.sparkShell.getProfile();
            const brief = (r && r.brief) || t("work.briefEmpty");
            alert(brief);
          } catch (err) {
            console.error(err);
          }
        };
        document.getElementById("btnPfClear").onclick = async () => {
          if (!confirm(t("confirm.clearProfile"))) return;
          try {
            await window.sparkShell.clearProfile();
            await loadProfileIntoForm();
            toast(t("toast.cleared"));
          } catch (err) {
            console.error(err);
          }
        };
        loadProfileIntoForm();

        async function toggleStar() {
          const r = await window.sparkShell.toggleBookmark();
          toast(r.message || (r.ok ? t("toast.bookmark") : t("toast.fail")));
        }
        starEl.onclick = toggleStar;
        document.getElementById("btnBmMenu").onclick = (e) => {
          e.stopPropagation();
          openBmMenu();
        };
        window.addEventListener("resize", () => packBookmarkBar());

        fillLocaleSelect();
        applyDom();
        async function clearChatNow() {
          if (!confirm(t("confirm.clearChat"))) return;
          try {
            const r = await window.sparkShell.clearChat();
            toast((r && r.message) || t("chat.cleared"));
          } catch (err) {
            console.error(err);
            toast(t("toast.saveFail"));
          }
        }
        async function copyAllChat() {
          const parts = [...document.querySelectorAll("#chat .bubble")].map((el) =>
            (el.textContent || "").trim(),
          ).filter(Boolean);
          if (!parts.length) return;
          try {
            await navigator.clipboard.writeText(parts.join("\n\n"));
            toast(t("chat.copied"));
          } catch (err) {
            console.error(err);
            toast(t("toast.fail"));
          }
        }
        const btnClearDock = document.getElementById("btnClearChatDock");
        if (btnClearDock) btnClearDock.onclick = clearChatNow;
        const btnCopyChat = document.getElementById("btnCopyChat");
        if (btnCopyChat) btnCopyChat.onclick = copyAllChat;
        const localeSel = document.getElementById("localeSelect");
        if (localeSel) {
          localeSel.onchange = async () => {
            const val = localeSel.value;
            applyLanguage(val);
            try {
              await window.sparkShell.saveSettings({ locale: val });
            } catch (err) {
              console.error(err);
            }
          };
        }
      }
      bindShell();
    </script>
  </body>
</html>
