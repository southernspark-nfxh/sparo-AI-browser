<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Sparo Agent Browser · sidebar</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
        --bg: #161618;
        --card: #222226;
        --line: #2e2e34;
        --text: #e8e8ea;
        --muted: #9a9aa3;
        --accent: #2f6fed;
        --ok: #3dd68c;
        --warn: #ffb020;
        --bad: #ff5c5c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 10px;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: hidden;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .value { font-size: 12px; word-break: break-all; }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        background: var(--ok);
      }
      .dot.paused { background: var(--warn); }
      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--accent);
        color: white;
        font-size: 12px;
        cursor: default;
      }
      button.ghost {
        background: #333;
      }
      button.danger { background: #8b2e2e; }
      button.ok { background: #1f6b45; }
      .row { display: flex; gap: 6px; }
      .row button { flex: 1; }
      .hint {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.45;
        margin: 0;
      }
      .scroll {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .approval {
        border: 1px solid #4a3a1a;
        background: #2a2418;
        border-radius: 8px;
        padding: 8px;
        margin-top: 6px;
      }
      .qa-item { font-size: 11px; margin: 2px 0; }
      .qa-item.pass { color: var(--ok); }
      .qa-item.fail { color: var(--bad); }
      .qa-item.warn { color: var(--warn); }
      .chat-log {
        height: 120px;
        overflow: auto;
        font-size: 11px;
        background: #121215;
        border-radius: 8px;
        padding: 6px;
        margin-bottom: 6px;
      }
      .chat-log .u { color: #9ec1ff; }
      .chat-log .a { color: #c8c8d0; }
      .chat-input {
        width: 100%;
        display: flex;
        gap: 6px;
      }
      .chat-input input {
        flex: 1;
        height: 28px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #121215;
        color: var(--text);
        padding: 0 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Sparo</h1>
    <div class="card">
      <div class="label">状态</div>
      <div class="value" id="status"><span class="dot" id="dot"></span>就绪</div>
      <div class="row" style="margin-top:8px">
        <button id="btnPause">暂停 / 人接管</button>
        <button class="ghost" id="btnResume">恢复 Agent</button>
      </div>
    </div>
    <div class="card">
      <div class="label">当前页</div>
      <div class="value" id="url">about:blank</div>
      <div class="label" style="margin-top:6px">标题</div>
      <div class="value" id="title">—</div>
    </div>

    <div class="scroll">
      <div class="card">
        <div class="label">概念说明</div>
        <p class="hint" id="explain">
          暂停：Agent 立刻停手，人可自由操作。<br />
          审批：Agent 请求确认后才继续（如提交）。<br />
          等待 wait_for：Agent 等页面元素出现，不是等人。
        </p>
      </div>

      <div class="card">
        <div class="label">审批队列</div>
        <div id="approvals"><p class="hint">暂无待审批项</p></div>
      </div>

      <div class="card">
        <div class="label">速卖通 QA</div>
        <button id="btnQa" style="width:100%;margin-bottom:6px">检查当前页</button>
        <div id="qa"><p class="hint">尚未检查</p></div>
      </div>

      <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:160px">
        <div class="label">Sparo chat (local · DeepSeek optional)</div>
        <div class="chat-log" id="chat"></div>
        <div class="chat-input">
          <input id="chatInput" placeholder="例如：打开百度 / 检查 QA / 暂停" />
          <button id="chatSend">发送</button>
        </div>
      </div>
    </div>

    <script>
      let paused = false;

      function renderApprovals(list) {
        const root = document.getElementById("approvals");
        if (!list || !list.length) {
          root.innerHTML = '<p class="hint">暂无待审批项</p>';
          return;
        }
        root.innerHTML = "";
        for (const a of list) {
          const box = document.createElement("div");
          box.className = "approval";
          box.innerHTML =
            '<div class="value"><b>' +
            (a.action || "") +
            "</b></div><div class='hint'>" +
            (a.reason || "") +
            '</div><div class="row" style="margin-top:6px"></div>';
          const row = box.querySelector(".row");
          const ok = document.createElement("button");
          ok.className = "ok";
          ok.textContent = "批准";
          ok.onclick = () => window.sparkShell.resolveApproval(a.id, true);
          const no = document.createElement("button");
          no.className = "danger";
          no.textContent = "拒绝";
          no.onclick = () => window.sparkShell.resolveApproval(a.id, false);
          row.appendChild(ok);
          row.appendChild(no);
          root.appendChild(box);
        }
      }

      function renderQa(qa) {
        const root = document.getElementById("qa");
        if (!qa) {
          root.innerHTML = '<p class="hint">尚未检查</p>';
          return;
        }
        let html = '<div class="value">' + (qa.summary || "") + "</div>";
        for (const it of qa.items || []) {
          html +=
            '<div class="qa-item ' +
            it.status +
            '">[' +
            it.status +
            "] " +
            it.label +
            (it.detail ? " — " + String(it.detail).slice(0, 80) : "") +
            "</div>";
        }
        root.innerHTML = html;
      }

      function renderChat(log) {
        const root = document.getElementById("chat");
        root.innerHTML = "";
        for (const m of log || []) {
          const div = document.createElement("div");
          div.className = m.role === "user" ? "u" : "a";
          div.textContent = (m.role === "user" ? "You: " : "Sparo: ") + m.text;
          root.appendChild(div);
        }
        root.scrollTop = root.scrollHeight;
      }

      function applyState(payload) {
        if (!payload) return;
        paused = !!payload.paused;
        document.getElementById("dot").className = "dot" + (paused ? " paused" : "");
        document.getElementById("status").innerHTML =
          '<span class="dot' +
          (paused ? " paused" : "") +
          '" id="dot"></span>' +
          (paused ? "已暂停（人接管）" : "Agent 可操控");
        document.getElementById("url").textContent = payload.url || "—";
        document.getElementById("title").textContent = payload.title || "—";
        if (payload.explain) {
          document.getElementById("explain").innerHTML =
            "暂停：" +
            payload.explain.pause +
            "<br/>审批：" +
            payload.explain.approval +
            "<br/>等待：" +
            payload.explain.wait;
        }
        renderApprovals(payload.approvals);
        renderQa(payload.qa);
        renderChat(payload.chat);
      }

      window.__sparkStatus = (payload) => applyState({ ...payload, approvals: [], qa: null, chat: [] });

      document.getElementById("btnPause").onclick = () => window.sparkShell.setPaused(true);
      document.getElementById("btnResume").onclick = () => window.sparkShell.setPaused(false);
      document.getElementById("btnQa").onclick = async () => {
        const r = await window.sparkShell.runQa();
        if (r && r.data) renderQa(r.data);
        else if (r) renderQa({ summary: r.message, items: [] });
      };

      async function sendChat() {
        const input = document.getElementById("chatInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        await window.sparkShell.chat(text);
      }
      document.getElementById("chatSend").onclick = sendChat;
      document.getElementById("chatInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendChat();
      });

      window.sparkShell.onSidebarState(applyState);
      window.sparkShell.getStatus().then(applyState);
    </script>
  </body>
</html>
