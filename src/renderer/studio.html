<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>媒体工作台</title>
  <style>
    :root { color-scheme: light; --line: #ddd; --warn: #8a4b08; --ok: #0b6b3a; --bg: #f6f5f2; --ink: #1c1b19; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    .app { display: grid; grid-template-columns: 168px 1fr; min-height: 100vh; }
    nav { background: #fff; border-right: 1px solid var(--line); padding: 16px 10px; }
    nav button { display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 8px 10px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; }
    nav button.on { background: #efeae2; }
    main { padding: 20px 24px 48px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    section { display: none; }
    section.on { display: block; }
    label { display: block; margin: 10px 0 4px; }
    input, textarea, select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    textarea { min-height: 180px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .checks label { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
    button.act { margin-top: 12px; padding: 8px 14px; border-radius: 8px; border: 1px solid #1c1b19; background: #1c1b19; color: #fff; cursor: pointer; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
    .warn { color: var(--warn); }
    .ok { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    td, th { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
  </style>
</head>
<body>
  <div class="app">
    <nav>
      <button type="button" data-view="overview" class="on">总览</button>
      <button type="button" data-view="draft">稿件</button>
      <button type="button" data-view="dispatch">分发</button>
      <button type="button" data-view="ledger">台账</button>
    </nav>
    <main>
      <section id="overview" class="on">
        <h1>总览</h1>
        <div class="card" id="overviewLines"></div>
      </section>
      <section id="draft">
        <h1>稿件</h1>
        <label>已有草稿</label>
        <select id="draftList"></select>
        <label>标题</label>
        <input id="title" />
        <label>摘要</label>
        <input id="summary" />
        <label>正文</label>
        <textarea id="body"></textarea>
        <label>封面文件</label>
        <input id="cover" placeholder="本地路径" />
        <label>正文图片，一行一个路径</label>
        <textarea id="images"></textarea>
        <label>首发平台</label>
        <select id="primary">
          <option value="toutiao">头条</option>
          <option value="baijiahao">百家</option>
          <option value="dayu">大鱼</option>
          <option value="sohu">搜狐</option>
        </select>
        <div class="checks" id="platformChecks"></div>
      </section>
      <section id="dispatch">
        <h1>分发</h1>
        <button type="button" class="act" id="precheck">预检</button>
        <div id="sheet"></div>
        <button type="button" class="act" id="confirm" hidden>确认发布</button>
        <p id="confirmNote"></p>
      </section>
      <section id="ledger">
        <h1>台账</h1>
        <div id="ledgerTable"></div>
      </section>
    </main>
  </div>
  <script>
    const api = window.sparkStudio;
    const PLATFORMS = [
      ["toutiao", "头条"],
      ["baijiahao", "百家"],
      ["dayu", "大鱼"],
      ["sohu", "搜狐"],
    ];
    let draft = null;
    let drafts = [];
    let timer = 0;

    function checks() {
      const box = document.getElementById("platformChecks");
      box.innerHTML = "";
      for (const [id, name] of PLATFORMS) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.platform = id;
        input.checked = draft.platforms?.[id]?.enabled !== false;
        input.onchange = () => scheduleSave();
        label.append(input, document.createTextNode(name));
        box.append(label);
      }
    }

    function readForm() {
      draft.title = document.getElementById("title").value;
      draft.summary = document.getElementById("summary").value;
      draft.body = document.getElementById("body").value;
      draft.cover = document.getElementById("cover").value.trim();
      draft.images = document.getElementById("images").value.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      draft.primaryPlatform = document.getElementById("primary").value;
      draft.platforms = {};
      for (const input of document.querySelectorAll("#platformChecks input")) {
        draft.platforms[input.dataset.platform] = { enabled: input.checked };
      }
      draft.schedule = {};
    }

    function fillForm() {
      document.getElementById("title").value = draft.title || "";
      document.getElementById("summary").value = draft.summary || "";
      document.getElementById("body").value = draft.body || "";
      document.getElementById("cover").value = draft.cover || "";
      document.getElementById("images").value = (draft.images || []).join("\n");
      document.getElementById("primary").value = draft.primaryPlatform || "toutiao";
      checks();
    }

    function scheduleSave() {
      clearTimeout(timer);
      timer = setTimeout(saveNow, 400);
    }

    async function saveNow() {
      readForm();
      const saved = await api.save(draft);
      draft = saved.draft;
    }

    function showOverview(overview) {
      document.getElementById("overviewLines").innerHTML =
        "<div>待发 " + overview.pending + "</div>" +
        "<div>失败 " + overview.failed + "</div>" +
        "<div>登录过期 " + overview.login + "</div>";
    }

    function showLedger(rows) {
      const host = document.getElementById("ledgerTable");
      if (!rows.length) {
        host.textContent = "还没有台账";
        return;
      }
      const table = document.createElement("table");
      table.innerHTML = "<tr><th>平台</th><th>标题</th><th>状态</th><th>原因</th></tr>";
      for (const row of rows) {
        const tr = document.createElement("tr");
        const cells = [row.platform || "", row.title || "", row.ok ? "成功" : "失败", row.reason || row.hint || ""];
        for (const text of cells) {
          const td = document.createElement("td");
          td.textContent = text;
          tr.append(td);
        }
        table.append(tr);
      }
      host.replaceChildren(table);
    }

    function showDrafts() {
      const select = document.getElementById("draftList");
      select.innerHTML = "";
      for (const item of drafts) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.title || item.id;
        select.append(option);
      }
      const fresh = document.createElement("option");
      fresh.value = "";
      fresh.textContent = "新建一篇";
      select.append(fresh);
      select.value = draft?.id || "";
    }

    document.querySelectorAll("nav button").forEach((button) => {
      button.onclick = () => {
        document.querySelectorAll("nav button").forEach((item) => item.classList.remove("on"));
        document.querySelectorAll("main section").forEach((item) => item.classList.remove("on"));
        button.classList.add("on");
        document.getElementById(button.dataset.view).classList.add("on");
      };
    });

    document.getElementById("title").oninput = scheduleSave;
    document.getElementById("summary").oninput = scheduleSave;
    document.getElementById("body").oninput = scheduleSave;
    document.getElementById("cover").oninput = scheduleSave;
    document.getElementById("images").oninput = scheduleSave;
    document.getElementById("primary").onchange = scheduleSave;
    document.getElementById("draftList").onchange = async (event) => {
      const id = event.target.value;
      if (!id) {
        draft = (await api.create()).draft;
      } else {
        draft = drafts.find((item) => item.id === id) || draft;
      }
      fillForm();
    };

    document.getElementById("precheck").onclick = async () => {
      await saveNow();
      const result = await api.precheck(draft);
      const sheet = document.getElementById("sheet");
      sheet.innerHTML = "";
      for (const row of result.rows) {
        const card = document.createElement("div");
        card.className = "card " + (row.level === "warn" ? "warn" : "ok");
        card.textContent = row.name + "  " + (row.skip ? "已跳过" : "默认发布") + "  " + row.marks.join("  ");
        sheet.append(card);
      }
      document.getElementById("confirm").hidden = false;
      document.getElementById("confirmNote").textContent = "";
    };

    document.getElementById("confirm").onclick = async () => {
      await saveNow();
      const result = await api.confirm(draft);
      document.getElementById("confirmNote").textContent = result.message;
    };

    api.load().then((payload) => {
      drafts = payload.drafts;
      draft = payload.draft;
      fillForm();
      showDrafts();
      showOverview(payload.overview);
      showLedger(payload.ledger);
    });
  </script>
</body>
</html>
