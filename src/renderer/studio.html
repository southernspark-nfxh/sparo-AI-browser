<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>媒体工作台</title>
  <link rel="stylesheet" href="./studio.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">媒体工作台</div>
      <label class="env">
        <span>环境</span>
        <select id="envSelect" aria-label="账号环境" title="账号环境"></select>
      </label>
      <div class="top-actions">
        <button type="button" id="openTasks" class="btn ghost" aria-label="发布记录" title="发布记录">发布记录</button>
        <button type="button" id="newDraft" class="btn primary" aria-label="新建稿件" title="新建稿件">新建稿件</button>
      </div>
    </header>
    <div class="frame">
      <nav class="sidebar" id="sidebar" aria-label="工作台导航"></nav>
      <main class="content">
        <div class="page" id="page"></div>
      </main>
    </div>
  </div>
  <script type="module" src="./studio.ts"></script>
</body>
</html>
