<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Sparo Agent Browser · chrome</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1a1e;
        --bg2: #25252b;
        --line: #33333a;
        --text: #e8e8ea;
        --muted: #9a9aa3;
        --accent: #3d7eff;
        --tab: #2a2a30;
        --tab-active: #35353d;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        user-select: none;
      }
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .tabs {
        display: flex;
        align-items: stretch;
        gap: 2px;
        padding: 4px 6px 0;
        height: 36px;
        background: #121215;
        overflow-x: auto;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 180px;
        min-width: 80px;
        padding: 0 8px 0 10px;
        background: var(--tab);
        border-radius: 8px 8px 0 0;
        font-size: 12px;
        cursor: default;
        border: 1px solid transparent;
        border-bottom: 0;
      }
      .tab.active {
        background: var(--tab-active);
        border-color: var(--line);
      }
      .tab .title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab .x {
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        line-height: 1;
        padding: 0;
        cursor: default;
      }
      .tab .x:hover { background: #444; color: #fff; }
      .new-tab {
        width: 28px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 18px;
        cursor: default;
      }
      .new-tab:hover { color: #fff; }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 8px;
        background: var(--bg2);
        border-bottom: 1px solid var(--line);
      }
      .nav {
        display: flex;
        gap: 2px;
      }
      .nav button {
        width: 32px;
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font-size: 14px;
        cursor: default;
      }
      .nav button:disabled { opacity: 0.35; }
      .nav button:hover:not(:disabled) { background: #333; }
      .url {
        flex: 1;
        height: 28px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #121215;
        color: var(--text);
        padding: 0 12px;
        font-size: 13px;
        outline: none;
      }
      .url:focus { border-color: var(--accent); }
      .go {
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="tabs" id="tabs"></div>
      <div class="bar">
        <div class="nav">
          <button id="back" title="后退">◀</button>
          <button id="forward" title="前进">▶</button>
          <button id="reload" title="刷新">⟳</button>
        </div>
        <input class="url" id="url" type="text" spellcheck="false" placeholder="输入网址，例如 baidu.com" />
        <button class="go" id="go">前往</button>
      </div>
    </div>
    <script>
      const tabsEl = document.getElementById("tabs");
      const urlEl = document.getElementById("url");
      const backEl = document.getElementById("back");
      const forwardEl = document.getElementById("forward");
      const reloadEl = document.getElementById("reload");
      const goEl = document.getElementById("go");

      let state = { tabs: [], activeId: null, url: "", canGoBack: false, canGoForward: false };

      function render() {
        tabsEl.innerHTML = "";
        for (const t of state.tabs) {
          const el = document.createElement("div");
          el.className = "tab" + (t.id === state.activeId ? " active" : "");
          el.title = t.url || "";
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = t.title || t.url || "新标签页";
          const x = document.createElement("button");
          x.className = "x";
          x.textContent = "×";
          x.onclick = (e) => {
            e.stopPropagation();
            window.sparkShell.closeTab(t.id);
          };
          el.onclick = () => window.sparkShell.switchTab(t.id);
          el.appendChild(title);
          el.appendChild(x);
          tabsEl.appendChild(el);
        }
        const add = document.createElement("button");
        add.className = "new-tab";
        add.textContent = "+";
        add.title = "新标签页";
        add.onclick = () => window.sparkShell.newTab();
        tabsEl.appendChild(add);

        if (document.activeElement !== urlEl) {
          urlEl.value = state.url || "";
        }
        backEl.disabled = !state.canGoBack;
        forwardEl.disabled = !state.canGoForward;
      }

      function navigateFromBar() {
        const v = urlEl.value.trim();
        if (!v) return;
        window.sparkShell.navigate(v);
      }

      goEl.onclick = navigateFromBar;
      urlEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") navigateFromBar();
      });
      backEl.onclick = () => window.sparkShell.goBack();
      forwardEl.onclick = () => window.sparkShell.goForward();
      reloadEl.onclick = () => window.sparkShell.reload();

      window.sparkShell.onChromeState((s) => {
        state = s || state;
        render();
      });

      window.sparkShell.listTabs().then((s) => {
        if (s) {
          state = s;
          render();
        }
      });
    </script>
  </body>
</html>
