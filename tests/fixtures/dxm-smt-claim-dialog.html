<!doctype html>
<html>
  <head><title>认领弹窗</title></head>
  <body>
    <div class="ant-modal-wrap">
      <div class="ant-modal exchange-btn-position">
        <div class="ant-modal-title">选择店铺-认领到采集箱</div>
        <label class="ant-checkbox-wrapper" style="display:none">
          <input class="ant-checkbox-input" type="checkbox" checked />
          <div class="flex w-145">eBay产品默认认领到原站点</div>
        </label>
        <label class="ant-checkbox-wrapper">
          <input class="ant-checkbox-input" type="checkbox" />
          <div class="flex w-145">示例店铺A</div>
        </label>
        <label class="ant-checkbox-wrapper">
          <input class="ant-checkbox-input" type="checkbox" />
          <div class="flex w-145">示例店铺B</div>
        </label>
        <span class="inline-block p-left5 h16">已选(0)</span>
        <button type="button" class="ant-btn ant-btn-primary">确定</button>
        <button type="button" class="ant-btn ant-btn-default">关闭</button>
      </div>
    </div>
  </body>
</html>
