<!doctype html>
<html>
  <head><title>采集箱编辑（脱敏夹具）</title></head>
  <body>
    <div class="anchor-menu">
      <a href="#dxmInfo">店小秘信息</a>
    </div>
    <div class="ant-form-item">
      <div class="ant-row">
        <div class="ant-col ant-form-item-label">店小秘分类</div>
        <div class="ant-col ant-form-item-control css-l8jjhh"><span>未分类</span><span> + </span><a>管理分类</a></div>
      </div>
    </div>
    <div class="ant-row">
      <div class="ant-col ant-form-item-label">产品标题</div>
      <div class="ant-col ant-form-item-control"><input class="ant-input" placeholder="请填写标题" value="示例标题" /></div>
    </div>
    <div class="ant-row">
      <div class="ant-col ant-form-item-label">包装重量</div>
      <div class="ant-col ant-form-item-control"><input class="ant-input" placeholder="请输入重量，示例：0.001" value="0.05" /></div>
    </div>
    <table class="sku-table">
      <tbody>
        <tr class="render-container skuDataItem_0">
          <td><input class="ant-input" placeholder="请输入" value="示例色A" /></td>
          <td><input class="ant-input" placeholder="请输入" value="S" /></td>
          <td><input class="ant-input" placeholder="请输入" value="10.00" /></td>
          <td><input class="ant-input" placeholder="请输入" value="8.00" /></td>
          <td><input class="ant-input" placeholder="请输入" value="1.20" /></td>
          <td><input class="ant-input" placeholder="请输入" value="2000" /></td>
          <td><input class="ant-input" placeholder="请输入" value="0" /></td>
        </tr>
        <tr class="render-container skuDataItem_1">
          <td><input class="ant-input" placeholder="请输入" value="示例色B" /></td>
          <td><input class="ant-input" placeholder="请输入" value="M" /></td>
          <td><input class="ant-input" placeholder="请输入" value="10.00" /></td>
          <td><input class="ant-input" placeholder="请输入" value="8.00" /></td>
          <td><input class="ant-input" placeholder="请输入" value="1.20" /></td>
          <td><input class="ant-input" placeholder="请输入" value="2000" /></td>
          <td><input class="ant-input" placeholder="请输入" value="0" /></td>
        </tr>
        <tr class="render-container skuDataItem_2">
          <td><input class="ant-input" placeholder="请输入" value="示例色C" /></td>
          <td><input class="ant-input" placeholder="请输入" value="L" /></td>
          <td><input class="ant-input" placeholder="请输入" value="10.00" /></td>
          <td><input class="ant-input" placeholder="请输入" value="8.00" /></td>
          <td><input class="ant-input" placeholder="请输入" value="1.20" /></td>
          <td><input class="ant-input" placeholder="请输入" value="2000" /></td>
          <td><input class="ant-input" placeholder="请输入" value="0" /></td>
        </tr>
      </tbody>
    </table>
    <div class="img-size-list">
      <span class="img-size">800 X 800</span>
      <span class="img-size">1280 X 1280</span>
      <span class="img-size">800 X 1000</span>
    </div>
    <button type="button">一键翻译</button>
    <button type="button">保存</button>
    <button type="button">保存并认领</button>
  </body>
</html>
