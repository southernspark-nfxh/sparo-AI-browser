<!doctype html>
<html>
  <head><title>采集编辑</title></head>
  <body>
    <div class="anchor-menu">
      <a href="#dxmInfo">店小秘信息</a>
      <a href="#productInfo">产品信息</a>
    </div>
    <input class="ant-input ant-input-sm" placeholder="请填写标题" value="示例标题" />
    <input class="ant-input" placeholder="示例：华为P60" value="" />
    <input class="ant-input ant-input-disabled" value="" />
    <iframe class="cke_wysiwyg_frame" src="about:blank"></iframe>
    <div>变种信息</div>
    <div class="sku-grid">
      <div class="sku-row"><span class="cell">颜色</span><span class="cell">尺寸</span><span class="cell">SKU</span><span class="cell">货源价格(CNY)</span><span class="cell">折扣价</span><span class="cell">价格(USD)</span><span class="cell">促销价</span><span class="cell">库存</span><span class="cell">包裹尺寸</span><span class="cell">包裹重量</span></div>
      <div class="sku-row"><span class="cell">色A</span><span class="cell">S</span><span class="cell">A1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="sku-row"><span class="cell">色B</span><span class="cell">S</span><span class="cell">B1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="sku-row"><span class="cell">色C</span><span class="cell">M</span><span class="cell">C1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="sku-row"><span class="cell">色D</span><span class="cell">M</span><span class="cell">D1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="sku-row"><span class="cell">色E</span><span class="cell">L</span><span class="cell">E1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="sku-row"><span class="cell">色F</span><span class="cell">L</span><span class="cell">F1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="sku-row"><span class="cell">色G</span><span class="cell">XL</span><span class="cell">G1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="sku-row"><span class="cell">色H</span><span class="cell">XL</span><span class="cell">H1</span><span class="cell">10</span><span class="cell"></span><span class="cell">1.75 USD</span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
    </div>
    <button type="button">一键翻译</button>
    <button type="button">保存</button>
    <button type="button">保存并认领</button>
  </body>
</html>
