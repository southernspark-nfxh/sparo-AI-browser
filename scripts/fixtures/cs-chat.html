<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Sparo CS Fixture</title>
    <style>
      body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
      .chat { max-width: 480px; margin: 24px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
      .log { height: 320px; overflow: auto; padding: 12px; }
      .bubble { margin: 8px 0; padding: 8px 10px; border-radius: 8px; max-width: 80%; }
      .customer { background: #eef2ff; }
      .agent { background: #e8f8ef; margin-left: auto; }
      .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #eee; }
      textarea { flex: 1; min-height: 56px; padding: 8px; }
      button { padding: 8px 14px; }
    </style>
  </head>
  <body>
    <div class="chat">
      <div class="log" role="log">
        <div class="bubble agent message">您好，请问有什么可以帮您？</div>
        <div class="bubble customer message">你好，这个不锈钢保温杯多少钱？有优惠吗？</div>
      </div>
      <div class="composer">
        <textarea id="input" placeholder="请输入回复…"></textarea>
        <button type="button" id="send">发送</button>
      </div>
    </div>
  </body>
</html>
